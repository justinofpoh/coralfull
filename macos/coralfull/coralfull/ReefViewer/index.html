<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main Reef Structure</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06110f;
        color: #e9fff8;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      #canvas, #canvas canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .card {
        position: absolute;
        z-index: 20;
        top: 50%;
        left: 50%;
        width: min(24rem, calc(100% - 2rem));
        padding: 1.1rem 1.15rem;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(172, 255, 226, 0.16);
        border-radius: 1rem;
        background: rgba(4, 20, 17, 0.88);
        box-shadow: 0 1.25rem 5rem rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(16px);
      }
      .heading { display: flex; align-items: center; gap: 0.65rem; font-weight: 600; }
      .card p { margin: 0.75rem 0; color: rgba(233, 255, 248, 0.76); font-size: 0.9rem; }
      .card small { display: block; margin-top: 0.65rem; color: rgba(233, 255, 248, 0.5); }
      .spinner {
        width: 0.9rem;
        height: 0.9rem;
        border: 2px solid rgba(114, 228, 189, 0.2);
        border-top-color: #72e4bd;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .track {
        height: 0.35rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(233, 255, 248, 0.1);
      }
      .track span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #43bc95, #9af4d4);
      }
      .controls {
        position: absolute;
        z-index: 10;
        right: 1.25rem;
        bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.45rem 0.45rem 0.45rem 0.85rem;
        border: 1px solid rgba(172, 255, 226, 0.12);
        border-radius: 999px;
        color: rgba(233, 255, 248, 0.62);
        background: rgba(4, 20, 17, 0.72);
        font-size: 0.75rem;
        backdrop-filter: blur(12px);
      }
      button {
        border: 1px solid rgba(172, 255, 226, 0.25);
        border-radius: 999px;
        padding: 0.5rem 0.85rem;
        color: #e9fff8;
        background: rgba(114, 228, 189, 0.12);
        cursor: pointer;
        font: inherit;
      }
      .legend {
        position: absolute;
        z-index: 10;
        left: 1.25rem;
        bottom: 1.25rem;
        display: flex;
        gap: 0.7rem;
        padding: 0.45rem 0.75rem;
        border: 1px solid rgba(172, 255, 226, 0.12);
        border-radius: 999px;
        color: rgba(233, 255, 248, 0.78);
        background: rgba(4, 20, 17, 0.72);
        font-size: 0.72rem;
        backdrop-filter: blur(12px);
      }
      .legend i {
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        margin-right: 0.3rem;
        border-radius: 50%;
        vertical-align: middle;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="canvas"></div>

    <section id="loading" class="card" role="status">
      <div class="heading">
        <span class="spinner" aria-hidden="true"></span>
        Loading the 3D reef
      </div>
      <p id="progress-label">Preparing the reef scan…</p>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <span id="progress-bar"></span>
      </div>
      <small>Spark is loading the gaussian splat from the app bundle.</small>
    </section>

    <section id="error" class="card" role="alert" hidden>
      <strong>We couldn’t load the reef.</strong>
      <p id="error-message"></p>
      <button type="button" onclick="window.retryReef()">Try again</button>
    </section>

    <div id="legend" class="legend" hidden>
      <span><i style="background:#00c800"></i>Healthy</span>
      <span><i style="background:#dc1e1e"></i>Unhealthy</span>
    </div>

    <div id="controls" class="controls" hidden>
      <span id="coverage"></span>
      <span>Drag to orbit · scroll to zoom · double-click to reframe</span>
      <button type="button" id="overlay-toggle" hidden>Show overlay</button>
      <button type="button" onclick="window.reframeReef()">Reframe reef</button>
    </div>

    <script src="./viewer.js"></script>
  </body>
</html>
